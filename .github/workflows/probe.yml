name: Probe live site
on:
  push:
    branches: [probe-roster]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p fx2
          while read -r u; do
            [ -z "$u" ] && continue
            h=$(printf '%s' "$u" | sha1sum | cut -c1-40)
            curl -s --compressed -o "fx2/$h.json" -w "%{http_code} %{size_download} $u\n" "$u"
          done < fx-urls2.txt
          B="https://site.web.api.espn.com/apis/common/v3/sports/basketball/womens-college-basketball/statistics/byathlete?region=us&lang=en&contentorigin=espn&seasontype=2&isqualified=true&page=1&limit=3&season=2026&group=50"
          while read -r k; do
            echo "$k => $(curl -s --compressed "$B&sort=$k:desc" | jq -c '[.athletes[]?|[.athlete.displayName,.categories[0].totals[0]]]')"
          done < fx-bbsorts.txt
          git config user.name probe && git config user.email probe@example.com
          git add fx2 && git commit -qm "Stats fixtures 2" && git push
