name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          B=https://rexegan.github.io/d1deepdive/
          curl -sI $B | grep -i 'cache-control\|last-modified\|age:'
          JS=$(curl -s $B | grep -o 'assets/index-[^"]*\.js' | head -1); echo "bundle $JS"
          curl -s "$B$JS" | grep -o 'tc-years\|tc-year-rec\|opp-rec' | sort | uniq -c
