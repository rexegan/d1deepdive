name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          C=https://sports.core.api.espn.com/v2/sports
          r() { echo "== $1"; curl -s -D /tmp/h --compressed -H 'Origin: https://rexegan.github.io' -o /tmp/b.json -w '%{http_code} %{size_download}\n' "$1"; grep -i 'access-control-allow-origin' /tmp/h; jq -c '[.items[]? | {name, type, summary}] | .[0:4]' /tmp/b.json | cut -c1-400; }
          for t in 0 1 2 3; do r "$C/football/leagues/college-football/seasons/2025/types/$t/teams/333/record"; done
          r "$C/football/leagues/college-football/seasons/2016/types/2/teams/333/record"
          r "$C/football/leagues/college-football/seasons/2026/types/2/teams/333/record"
          for t in 2 3; do r "$C/basketball/leagues/mens-college-basketball/seasons/2026/types/$t/teams/150/record"; done
          r "$C/basketball/leagues/mens-college-basketball/seasons/2027/types/2/teams/150/record"
          for t in 2 3; do r "$C/baseball/leagues/college-baseball/seasons/2026/types/$t/teams/85/record"; done
          r "$C/baseball/leagues/college-baseball/seasons/2017/types/2/teams/85/record"
          for t in 2 3 4 5; do r "$C/baseball/leagues/college-softball/seasons/2026/types/$t/teams/611/record"; done
          r "$C/football/leagues/college-football/seasons/2024/teams/252"
          jq -c '{record:.record, recref:.record["$ref"]}' /tmp/b.json | cut -c1-300
