name: Probe ESPN endpoints
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          C=https://sports.core.api.espn.com/v2/sports
          hdr() { echo "=== $1"; curl -sL -o /tmp/b -D /tmp/h -H "Origin: https://rexegan.github.io" "$1"; grep -E "^HTTP" /tmp/h | tail -1; grep -i "access-control-allow-origin" /tmp/h || echo "NO CORS"; }
          hdr "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/draft?season=2025"; jq -c 'keys' /tmp/b | head -c 400; echo
          jq -c '.picks[0]?, (.picks|length)' /tmp/b | head -c 1500; echo
          hdr "https://site.api.espn.com/apis/site/v2/sports/football/nfl/draft?season=2025"; head -c 300 /tmp/b; echo
          hdr "$C/football/leagues/nfl/seasons/2025/draft/rounds"; jq -c '.count, (.items[0].picks[0])' /tmp/b | head -c 1200; echo
          A=$(jq -r '.items[0].picks[0].athlete."$ref"' /tmp/b); echo "athlete ref $A"
          curl -sL "$A" | jq -c '{displayName, college: .college, position: .position.abbreviation}' | head -c 600; echo
          hdr "$C/football/leagues/college-football/seasons/2026/teams/333/coaches"; jq -c '.' /tmp/b | head -c 800; echo
          R=$(jq -r '.items[0]."$ref"' /tmp/b); curl -sL "$R" | jq -c '{firstName, lastName, experience, headshot, dateOfBirth, birthPlace, college: .college, careerRecords: (.careerRecords."$ref"), keys: keys}' | head -c 1200; echo
          hdr "https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/teams/333/coaches"; head -c 300 /tmp/b; echo
          hdr "$C/football/leagues/nfl/seasons/2025/draft/athletes?limit=300"; jq -c '.count' /tmp/b
          hdr "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/draft?season=2025&college=333"; jq -c '(.picks|length)' /tmp/b
