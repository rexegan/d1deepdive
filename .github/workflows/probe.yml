name: Probe live site
on:
  push:
    branches: [probe-roster]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-x9fl16
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd app && npm ci && npm run build
          (npx vite preview --port 4173 --strictPort &) ; sleep 3
          cd .. && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node shots/shoot.cjs
          git config user.name probe && git config user.email probe@example.com
          git add shots/*.png && git commit -qm "Screenshots" && git push
