name: Probe live site
on:
  push:
    branches: [probe-roster]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          set +e
          mkdir -p fx3
          node scripts/build-defense.mjs && cp public/data/cfb-defense.json fx3/
          mkdir -p fx3
          while read -r u; do
            [ -z "$u" ] && continue
            h=$(printf '%s' "$u" | sha1sum | cut -c1-40)
            curl -s --compressed -o "fx3/$h.json" -w "%{http_code} %{size_download} $u\n" "$u"
          done < fx-urls3.txt
          git config user.name probe && git config user.email probe@example.com
          git add fx3 && git commit -qm "Conference fixtures" && git push
