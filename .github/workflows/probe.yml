name: Probe ESPN endpoints
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          C=https://sports.core.api.espn.com/v2/sports
          for y in 2026 2015 2005; do echo "=== draft $y"; curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/draft?season=$y" | jq -c '.year, (.picks|length), (.picks[0] | {round, pick, overall, teamId, n: .athlete.displayName, pos: .athlete.position, t: .athlete.team}), (.teams[0] | {id, displayName, abbreviation, logo: .logos[0].href}), ([.positions[0:2][]?])' | head -c 1200; echo; done
          echo "=== coach"; curl -sL "$C/football/leagues/college-football/seasons/2026/coaches/4608671" | jq -c '.person, .records' ; 
          P=$(curl -sL "$C/football/leagues/college-football/seasons/2026/coaches/4608671" | jq -r '.person."$ref"'); echo "person $P"; curl -sL "$P" | jq -c 'del(.links)' | head -c 1000; echo
          R=$(curl -sL "$C/football/leagues/college-football/seasons/2026/coaches/4608671" | jq -r '.records."$ref" // empty'); [ -n "$R" ] && curl -sL "$R" | head -c 800; echo
          echo "=== coach2"; curl -sL "$C/football/leagues/college-football/coaches/4608671" | jq -c 'keys, .careerRecords' | head -c 800; echo
          echo "=== wiki"; curl -s -D /tmp/h -o /tmp/b -H "Origin: https://rexegan.github.io" "https://en.wikipedia.org/api/rest_v1/page/summary/Alabama_Crimson_Tide_football"; grep -iE "^HTTP|access-control-allow-origin" /tmp/h; jq -c '{title, extract, thumb: .thumbnail.source}' /tmp/b | head -c 600; echo
          curl -s "https://en.wikipedia.org/api/rest_v1/page/summary/Kalen_DeBoer" | jq -c '{title, description, thumb: .thumbnail.source}'
          echo "=== mbb coach"; curl -sL "$C/basketball/leagues/mens-college-basketball/seasons/2027/teams/239/coaches" | jq -c '.count'
