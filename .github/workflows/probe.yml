name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          W=https://site.web.api.espn.com/apis/common/v3/sports
          L=https://site.web.api.espn.com/apis/site/v3/sports
          P="region=us&lang=en&contentorigin=espn"
          probe() {
            echo "===== $1"
            curl -s --compressed -D /tmp/h -o /tmp/b -H "Origin: https://rexegan.github.io" "$1"
            head -1 /tmp/h; grep -i "access-control-allow-origin" /tmp/h
            jq -c "$2" /tmp/b 2>&1 | cut -c1-3500
          }
          A='{keys:keys, cats:[.categories[]?|{name,displayName,labels,names:.names}], pag:.pagination, first:(.athletes[0]|{athlete:(.athlete|{id,displayName,teamShortName,teamId,position:.position.abbreviation,headshot:.headshot.href,teamLogos:(.teamLogos|length)}),categories:[.categories[]|{name,totals,ranks}]})}'
          T='{keys:keys, cats:[.categories[]?|{name,displayName,names}], pag:.pagination, n:(.teams|length), first:(.teams[0]|{team:(.team|{id,displayName,abbreviation,logos:(.logos|length)}),categories:[.categories[]|{name,values,totals,ranks}]})}'
          G='{rs:.requestedSeason, cs:.currentSeason, pag:(.pagination|{count,pages}), a0:(.athletes[0].athlete|del(.links)), a1:[.athletes[1:6][]|{n:.athlete.displayName,t:.athlete.teamShortName,gp:.categories[0].totals[0]}]}'
          probe "$W/basketball/mens-college-basketball/statistics/byathlete?$P&isqualified=true&page=1&limit=5&group=50&sort=offensive.avgPoints:desc&season=2025" "$G"
          probe "$W/basketball/mens-college-basketball/statistics/byathlete?$P&isqualified=true&page=1&limit=5&group=50&sort=offensive.avgPoints:desc&season=2026" "$G"
          probe "$W/basketball/mens-college-basketball/statistics/byathlete?$P&isqualified=true&page=1&limit=5&group=50&sort=offensive.avgPoints:desc&season=2027" "$G"
          probe "$W/basketball/mens-college-basketball/statistics/byathlete?$P&isqualified=true&page=1&limit=5&group=50&sort=offensive.avgPoints:desc" "$G"
          probe "$W/basketball/mens-college-basketball/statistics/byteam?$P&page=1&limit=3&group=50&sort=offensive.avgPoints:desc&season=2026" '{rs:.requestedSeason,cs:.currentSeason,pag:.pagination.count,t:[.teams[]|.team|del(.links)]|.[0], n:[.teams[]|.team.displayName], cats:[.teams[0].categories[]|.name]}'
          probe "$W/football/college-football/statistics/byathlete?$P&isqualified=true&page=1&limit=3&group=80&sort=passing.QBR:desc&season=2026&seasontype=2" "$G"
          probe "$W/football/college-football/statistics/byathlete?$P&isqualified=false&page=1&limit=3&group=80&sort=defensive.kicksBlocked:desc&season=2026&seasontype=2" '{err:.error, code:.code, msg:.message, a:[.athletes[]?|.athlete.displayName]}'
          probe "$W/football/college-football/statistics/byathlete?$P&isqualified=true&page=1&limit=1&group=80&sort=passing.passingYards:desc&season=2026&seasontype=2" '.glossary'
          probe "$W/football/college-football/statistics/byteam?$P&page=1&limit=2&group=80&season=2026&seasontype=2" '{t:[.teams[0].categories[]|{name,displayName,n:(.values|length)}], team:(.teams[0].team|del(.links))}'
          probe "$W/football/college-football/statistics/byteam?$P&page=1&limit=200&group=81&season=2026&seasontype=2" '{n:(.teams|length)}'
          probe "$W/football/college-football/statistics/byteam?$P&page=1&limit=200&group=80&season=2026&seasontype=2" '{n:(.teams|length)}'
          probe "$W/football/college-football/statistics/byathlete?$P&isqualified=true&page=1&limit=3&group=8&sort=rushing.rushingYards:desc&season=2026&seasontype=2" "$G"
          probe "https://site.api.espn.com/apis/site/v2/sports/football/college-football/statistics?season=2026&group=80" '{st:[.stats.categories[]?|{name,displayName,n:(.leaders|length)}], s:(.stats|keys?)}'
          probe "$W/baseball/college-baseball/statistics/byathlete?$P&isqualified=true&page=1&limit=3&season=2026" 'del(.glossary)|tostring|.[0:800]'
          probe "$W/baseball/college-baseball/statistics/byathlete?$P&isqualified=true&page=1&limit=3&season=2026&category=batting&sort=batting.avg:desc" 'del(.glossary)|tostring|.[0:800]'
          probe "$W/baseball/college-baseball/statistics/byteam?$P&page=1&limit=3&season=2026" 'del(.glossary)|tostring|.[0:800]'
          probe "$W/baseball/college-softball/statistics/byteam?$P&page=1&limit=3&season=2026" 'del(.glossary)|tostring|.[0:800]'
          probe "https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/statistics?season=2026" 'tostring|.[0:1200]'
