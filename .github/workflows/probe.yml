name: Probe ESPN endpoints
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          S=https://site.api.espn.com/apis/site/v2/sports
          for p in baseball/college-baseball baseball/college-softball; do
            echo "=== $p raw"; curl -s "$S/$p/scoreboard?dates=20260418" | head -c 200; echo
            echo "=== $p conf ids"; curl -s "$S/$p/scoreboard?dates=20260418" | jq -c '(.events|length), ([.events[]?.competitions[0].competitors[].team.conferenceId] | unique)'
            for g in 50 8 23 2 7 26; do echo "groups=$g"; curl -s "$S/$p/scoreboard?dates=20260418&groups=$g" | jq -c '(.events|length)'; done
            echo "=== $p team sched"; curl -s "$S/$p/teams/239/schedule" | jq -c '.team.groups, .team.standingSummary, (.events|length)'
            echo "=== $p team stats"; curl -s -o /dev/null -w "%{http_code}\n" "$S/$p/teams/239/statistics"
            echo "=== $p standings sample"; curl -s "https://site.api.espn.com/apis/v2/sports/$p/standings" | jq -c '.children[0].standings.entries[0:3][] | {t: .team.displayName, id: .team.id}'
          done
          echo "=== mbb pac12 21"; curl -s "$S/basketball/mens-college-basketball/scoreboard?dates=20260214&groups=21" | jq -c '(.events|length)'
          echo "=== mbb rankings names"; curl -s "$S/basketball/mens-college-basketball/rankings" | jq -c '[.rankings[].name]'
          echo "=== mbb team sched groups"; curl -s "$S/basketball/mens-college-basketball/teams/239/schedule" | jq -c '.team.groups, .team.standingSummary'
