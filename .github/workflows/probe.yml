name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          S=https://site.api.espn.com/apis/site/v2/sports
          for p in "baseball/college-baseball/teams/85" "baseball/college-softball/teams/611" "basketball/mens-college-basketball/teams/150" "basketball/womens-college-basketball/teams/41"; do
            for q in "seasontype=1" "seasontype=2" "seasontype=3" "seasontype=4" "seasontype=5" "seasontype=2&season=2026"; do
              echo "== $p $q $(curl -s --compressed "$S/$p/schedule?$q" | jq -c '{rs:.requestedSeason, n:(.events|length), first:.events[0].date, last:.events[-1].date, notes:[.events[].competitions[0].notes[0].headline]|unique|.[0:4]}' | cut -c1-400)"
            done
          done
          curl -s --compressed "$S/baseball/college-baseball/teams/85/schedule" | jq -c '[.events[-3:][] | {date, name, st:.seasonType}]'
