name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          L=https://site.web.api.espn.com/apis/site/v3/sports
          g() { echo "== $1"; curl -s -o /tmp/b.json -w '%{http_code}\n' "$1"; }
          g "$L/football/college-football/leaders?season=2026"
          jq -c '.leaders.categories[0].leaders[0] | del(.athlete.links) | .athlete |= with_entries(select(.key != "links"))' /tmp/b.json | cut -c1-2500
          jq -c '.leaders.categories[0].leaders[0] | keys' /tmp/b.json
          jq -c '[.leaders.categories[0].leaders[] | {t:.athlete.team, tid:.athlete.teamId, team:.team}] | .[0:3]' /tmp/b.json | cut -c1-1500
          for q in "group=8" "group=5" "seasontype=2&group=80"; do g "$L/football/college-football/leaders?season=2026&$q"; jq -c '[.leaders.categories[0] | {n:(.leaders|length), top:[.leaders[0:3][] | .athlete.displayName + " " + (.athlete.team.abbreviation // "-")]}]' /tmp/b.json; done
          for s in mens-college-basketball womens-college-basketball; do for y in 2026 2027; do g "$L/basketball/$s/leaders?season=$y"; jq -c '[.leaders.categories[]? | {name, n:(.leaders|length), top:(.leaders[0] | .displayValue + " " + .athlete.displayName + " " + (.athlete.team.abbreviation // "-"))}]' /tmp/b.json | cut -c1-1500; done; done
          g "$L/basketball/mens-college-basketball/leaders?season=2026&group=50"; jq -c '[.leaders.categories[]? | {name, top:(.leaders[0] | .displayValue + " " + .athlete.displayName + " " + (.athlete.team.abbreviation // "-"))}]' /tmp/b.json | cut -c1-800
          g "$L/basketball/mens-college-basketball/leaders?season=2026&group=8"; jq -c '[.leaders.categories[]? | {name, top:(.leaders[0] | .displayValue + " " + .athlete.displayName + " " + (.athlete.team.abbreviation // "-"))}]' /tmp/b.json | cut -c1-800
          for s in college-baseball college-softball; do g "$L/baseball/$s/leaders?season=2026"; jq -c '[.leaders.categories[]? | {name, n:(.leaders|length), top:(.leaders[0] | .displayValue + " " + .athlete.displayName)}]' /tmp/b.json | cut -c1-1500; done
