name: Probe ESPN endpoints
on:
  push:
    branches: [probe-espn]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://site.api.espn.com/apis/site/v2/sports
          V=https://site.api.espn.com/apis/v2/sports
          echo "=== schedule team"; curl -s "$S/football/college-football/teams/333/schedule" | jq -c '.team'
          echo "=== cfb record-ish stats"; curl -s "$V/football/college-football/standings?group=80" | jq -c '[.children[0].standings.entries[0].stats[] | select(.displayValue|test("^[0-9]+-[0-9]+")) | {name, type, displayValue}]'
          for p in basketball/mens-college-basketball basketball/womens-college-basketball baseball/college-baseball baseball/college-softball; do
            echo "=== $p standings"; curl -s -D /tmp/h "$V/$p/standings" | jq -c '{n: (.children|length), first: .children[0].name, entries: (.children[0].standings.entries|length), kids: (.children[0].children|length), rec: [.children[0].standings.entries[0].stats[]? | select(.displayValue|test("^[0-9]+-[0-9]+")) | {name, type, displayValue}]}' | head -c 700; grep -i access-control-allow-origin /tmp/h
            echo "=== $p rankings"; curl -s "$S/$p/rankings" | jq -c '[.rankings[].name]'
            echo "=== $p scoreboard groups=50"; curl -s "$S/$p/scoreboard?groups=50&dates=20260301" | jq -c '(.events|length)'
            echo "=== $p scoreboard nogroups"; curl -s "$S/$p/scoreboard?dates=20260301&limit=1000" | jq -c '(.events|length)'
          done
          echo "=== cfb fcs standings"; curl -s "$V/football/college-football/standings?group=81" | jq -c '[.children[] | {id, name, abbreviation}]'
          echo "=== cfb fbs ids"; curl -s "$V/football/college-football/standings?group=80" | jq -c '[.children[] | {id, name, abbreviation}]'
          echo "=== d2"; curl -s "$V/football/college-football/standings?group=35" | jq -c '(.children|length)'
          echo "=== d2 scoreboard"; curl -s "$S/football/college-football/scoreboard?groups=35" | jq -c '(.events|length)'
