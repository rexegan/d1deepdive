name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          W=https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/statistics/byathlete
          P="region=us&lang=en&contentorigin=espn&seasontype=2&isqualified=true&page=1&limit=3&season=2026&group=80"
          while read -r q k; do
            cat=${k%%.*}; st=${k#*.}
            r=$(curl -s --compressed "$W?$P&$q" | jq -r --arg c "$cat" --arg s "$st" '(.categories[]?|select(.name==$c)|.names|index($s)) as $i | [.athletes[]?|(.athlete.displayName+"="+((.categories[]|select(.name==$c)|.totals[$i])//"?"))]|join(", ")')
            echo "$q => ${r:-NONE} (count $(curl -s --compressed "$W?$P&$q" | jq '.pagination.count'))"
          done < fx-sorts.txt
