name: Probe live site
on:
  push:
    branches: [probe-roster]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf fx2 && mkdir -p fx2
          while read -r u; do
            [ -z "$u" ] && continue
            h=$(printf '%s' "$u" | sha1sum | cut -c1-40)
            curl -s --compressed -o "fx2/$h.json" -w "%{http_code} %{size_download} $u\n" "$u"
          done < fx-urls.txt
          git config user.name probe && git config user.email probe@example.com
          git add fx2 && git commit -qm "Stats fixtures" && git push
