name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          S=https://site.api.espn.com/apis/site/v2/sports
          for x in "football/college-football 401859185" "football/college-football 401856842" "basketball/mens-college-basketball 401920982" "baseball/college-baseball 401848643"; do
            set -- $x
            echo "===== $1 $2"
            curl -s --compressed "$S/$1/summary?event=$2" | jq -c 'walk(if type=="object" then del(.links, .link, .logos, .tracking) else . end) | {pickcenter, odds, predictor, header:{competitions:[.header.competitions[0]|del(.details)]}, gameInfo}'
          done
