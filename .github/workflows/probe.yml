name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          V=https://site.api.espn.com/apis/v2/sports
          s() { echo "== $1"; curl -s --compressed "$1" | jq -c '[.. | objects | select(.entries?) | .entries[]] | {n:length, first:(.[0] | {t:.team.displayName, rec:([.stats[] | select(.type=="total" or .name=="overall") | .displayValue])})}' | cut -c1-300; }
          s "$V/football/college-football/standings?group=80"
          s "$V/football/college-football/standings?group=80&season=2025"
          s "$V/football/college-football/standings?group=81&season=2024"
          s "$V/basketball/mens-college-basketball/standings"
          s "$V/basketball/mens-college-basketball/standings?season=2026"
          s "$V/basketball/mens-college-basketball/standings?season=2025"
          s "$V/baseball/college-baseball/standings"
          s "$V/baseball/college-baseball/standings?season=2025"
          s "$V/baseball/college-softball/standings?season=2026"
