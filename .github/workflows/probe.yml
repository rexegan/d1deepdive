name: Probe live site
on:
  push:
    branches: [probe-roster]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-x9fl16
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd app && npm ci && npm run build
      - run: npm init -y >/dev/null && npm i playwright@1
      - run: |
          (cd app && nohup npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          sleep 4
          timeout 400 node shots/shoot.cjs || true
      - run: |
          git config user.name probe && git config user.email probe@example.com
          git add shots/*.png && git commit -qm "Screenshots" && git push
