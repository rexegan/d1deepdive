name: Probe live site
on:
  push:
    branches: [probe-roster]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://rexegan.github.io/d1deepdive/data/draft.json | jq -c '.built, (.byCollege|length), (.byCollege["Alabama|Crimson Tide"]|length), (.byCollege["Alabama|Crimson Tide"][0]), (.byCollege["Baylor|Bears"][0:2])'
